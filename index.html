<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devmcap</title>
    <meta
      name="description"
      content="Miguel Molina, developer. I build backend systems in Python, working with AI agents across the whole stack."
    />
    <script>
      // Apply the saved theme before the first paint, so there is no flash of dark.
      // Keep in sync with parseTheme in src/components/theme.ts.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
